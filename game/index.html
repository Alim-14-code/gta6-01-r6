<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Lights — Port Alegre</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14101c;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(180deg, #1a2340 0%, #7a3a5a 55%, #e8803a 100%);
  }
  canvas {
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    background: #14101c;
    image-rendering: auto;
  }
  #err {
    position: fixed;
    left: 8px;
    bottom: 8px;
    color: #ff8080;
    font: 12px monospace;
    white-space: pre-wrap;
    max-width: 90vw;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="err"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
